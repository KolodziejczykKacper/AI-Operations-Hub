[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operations-hub"
version = "0.1.0"
description = "Local human-in-the-loop email-to-record workflow: rule-based extraction, review API, Streamlit UI, Excel export, optional Claude analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "sqlmodel>=0.0.22,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "openpyxl>=3.1,<4",
    "anthropic>=1,<2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2", "httpx2>=2,<3"]
dev = ["pytest>=9.0.3,<10", "streamlit>=1.40,<2", "httpx2>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
