[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operations-hub"
version = "0.1.0"
description = "AI Operations Hub - ingestion, rule-based analysis and human review API"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "sqlmodel>=0.0.22,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2", "httpx2>=2,<3"]
dev = ["pytest>=8,<9", "streamlit>=1.40,<2", "httpx2>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
